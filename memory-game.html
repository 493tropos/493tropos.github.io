<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>神経衰弱</title>

<link rel="stylesheet" href="style.css">

<style>
#clock{font-size:30px;}
#field {
    width : 600px;
    height : 200px;
    border : 2px solid #aaa;
    box-sizing : border-box;
    position : relative;
}
	#taken {
    width : 600px;
    height : 200px;
    border : 2px solid #aaa;
    box-sizing : border-box;
    margin-top : 20px;
}

	#taken .card {
    position : static;
    float : left;
}
	
.card {
	width : 70px;
	height : 80px;
	//vertical-align:middle;
	line-height:100%
	//line-height : 80px;
	text-align : center;
	border : 2px solid #aaa;
	border-radius : 5px;
	font-size : 30px;
	margin:8px;
	float : left;
	position : absolute;
}
</style>

</head>

<body>

<div id="clock"></div>
	<div id="columns">
    横に並べる枚数：
    <button>2</button>
    <button>4</button>
    <button>6</button>
</div>

<div id="field">
</div>
<div id="taken"></div>

<script>


//==================================================
// ① 乱数を作る関数
//==================================================

// min以上、max以下の整数をランダムに1つ返す
function rand(min,max)
{
	return Math.floor(Math.random()*(max-min+1)+min);
}


//==================================================
// ② カードの候補
//==================================================

let candidates = [
"119","121","133","143","161","169","187","203","209","217","221","247","253","259","287","289","299","301","319","323","329","341","343","361","371","377","391","403","407","413","427","437","451","469","473","481","493","497","511","517","527","529","533","539","551","553","559","581","583","589","611","623","629","637","649","667","671","679","689","697","703","707","713","721","731","737","749","763","767","779","781","791","793","799","803","817","833","841","847","851","869","871","889","893","899","901","913","917","923","931","943","949","959","961","973","979","989",
];


//==================================================
// ③ 候補の中から6種類をランダムに選ぶ
//==================================================

let selectedCards = [];

for(let i = 0; i < 6; i++)
{
	let selected;

	do
	{
		let r = rand(0, candidates.length - 1);
		selected = candidates[r];
	}
	while(selectedCards.includes(selected));

	selectedCards.push(selected);
}


//==================================================
// ④ 選んだ6種類を、それぞれ2枚ずつにする
//==================================================

let cards = [];

for(let i = 0; i < selectedCards.length; i++)
{
	cards.push(selectedCards[i]);
	cards.push(selectedCards[i]);
}


//==================================================
// ⑤ 12枚のカードをシャッフルする
//==================================================

for(let i = cards.length-1; i > 0; i--)
{
	let r = rand(0,i);

	let tmp = cards[i];
	cards[i] = cards[r];
	cards[r] = tmp;
}


//==================================================
// ⑥ HTML上にカードを12個作る
//==================================================

	let columns = 6;
	document.querySelector("#columns button:nth-of-type(1)").onclick = function(){ columns = 2; };
document.querySelector("#columns button:nth-of-type(2)").onclick = function(){ columns = 4; };
document.querySelector("#columns button:nth-of-type(3)").onclick = function(){ columns = 6; };
	
let field = document.getElementById("field");
	let taken = document.getElementById("taken");

for(let i = 0; i < cards.length; i++)
{
	let elm = document.createElement("div");

	elm.className = "card";
	elm.innerHTML = "";
	elm.index = i;
	elm.style.left = (i % columns) * 90 + "px";
elm.style.top = Math.floor(i / columns) * 100 + "px";
	elm.onclick = click;

	field.appendChild(elm);
}


//==================================================
// ⑦ ゲームの状態を記録する変数
//==================================================

// 1枚目に選んだカード
let first = null;

// 2枚目に選んだカード
let second = null;

// カードを隠すためのタイマー
let timer = null;

// 揃ったカードの枚数
let mekuri = 0;


//==================================================
// ⑧ 経過時間の表示
//==================================================

let count = 0;
let clock = document.getElementById("clock");

let timer2 = setInterval(function()
{
	clock.innerText = `経過時間:${(count++/10).toFixed(1)}秒`;
}
,100);


//==================================================
// ⑨ カードをクリックしたときの処理
//==================================================

function click(e)
{
	// 前の2枚を隠す待ち時間中にクリックされた場合
	if(timer)
	{
		clearTimeout(timer);
		hideCards();
	}

	// 今クリックされたカードを取得
	let elm = e.target;

	// カードの数字を表示
	elm.innerHTML = cards[elm.index];


	// まだ1枚目が選ばれていない
	if(!first)
	{
		first = elm;
	}

	// 1枚目と同じカードをもう一度クリックした
	else if(first.index == elm.index)
	{
		return;
	}

	// 2枚目が選ばれた
	else
	{
		second = elm;

		// すぐに2枚を判定する
		judge();
	}
}


//==================================================
// ⑩ カードを隠す・裏返す処理
//==================================================

function hideCards()
{
	// 2枚が同じだった場合
	if (first.innerHTML == second.innerHTML)
{
    taken.appendChild(first);
    taken.appendChild(second);
}

	// 2枚が違った場合
	else
	{
		first.innerHTML = "";
		second.innerHTML = "";
	}

	// 次の2枚を選べるように状態をリセット
	first = null;
	second = null;
	timer = null;
}


//==================================================
// ⑪ 2枚のカードを判定する処理
//==================================================

function judge()
{
	// 2枚が同じだった場合
	if(first.innerHTML == second.innerHTML)
	{
		// 揃ったカードを2枚増やす
		mekuri += 2;

		// すべて揃った場合
		if(mekuri == cards.length)
		{
			clearInterval(timer2);
		}
	}

	// カードを隠す処理は1秒後
	timer = setTimeout(hideCards, 1000);
}


</script>
