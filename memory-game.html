//javascriptで神経衰弱

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>神経衰弱</title>

<style>
#clock{font-size:30px;}
#field{ width : 600px; }
.card {
	width : 70px;
	height : 80px;
	//vertical-align:middle;
	line-height:100%
	//line-height : 80px;
	text-align : center;
	border : 2px solid #aaa;
	border-radius : 5px;
	font-size : 30px;
	margin:8px;
	float : left;
	}
</style>

</head>

<body>

<div id="clock"></div>
<div id="field">
</div>
<script>

//min~maxの整数乱数を作る関数
function rand(min,max)
{
	return Math.floor(Math.random()*(max-min+1)+min);
}

let cards = [
"833","847",
"833","847",
];
//シャッフルのアルゴリズム
for(let i = cards.length-1; i>0; i--)
{
	let r = rand(0,i);
	let tmp = cards[i];
	cards[i] = cards[r];
	cards[r] = tmp;
}

let field = document.getElementById("field");

for(let i=0 ; i<cards.length; i++)
{
	let elm = document.createElement("div");
	
	elm.className = "card";
	elm.innerHTML = ""; //cards[i];
	elm.index = i;
	elm.onclick = click;
	field.appendChild(elm);
	
}

let first = null;
let second =null;
let timer = null;

let count=0;
let mekuri = 0;
let clock = document.getElementById("clock");
let timer2 = setInterval (function(){
	clock.innerText = `経過時間:${(count++/10).toFixed(1)}秒`;
	}
,100);

//クリックの処理
function click(e)
{
	if(timer)
	{
		clearTimeout(timer);
		
		judge();
	}
	
	let elm = e.target;
	//elm.style.visibility="hidden";
	elm.innerHTML = cards[elm.index];
	
	if (!first)
	{
		first = elm;
	}
	else if(first.index == elm.index)
	{
		return;
	}
	else
	{
		second = elm;
		timer = setTimeout(judge, 1000);//1秒
	}
}

//判定の関数
function judge()
{
	if (first.innerHTML == second.innerHTML)
		{
			first.style.visibility="hidden";
			second.style.visibility="hidden";
			mekuri+=2;
			if(mekuri == cards.length) clearInterval(timer2);
		}
		else
		{
			first.innerHTML = "";
			second.innerHTML = "";
		}
		first = null;
		second = null;
		timer = null;
}


</script>

</body>
</html>
