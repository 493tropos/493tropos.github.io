<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            font-family: Arial, sans-serif;
            background-color: #FFF8F0;
        }

        h1 {
            text-align: center;
            color: orange;
            -webkit-text-stroke: 1px yellowgreen;
            text-shadow:
                1px 1px 0 yellowgreen,
                -1px -1px 0 yellowgreen,
                1px -1px 0 yellowgreen,
                -1px 1px 0 yellowgreen;
            margin-bottom: 40px;
        }

        .message {
            background-color: #FFE4C4;
            padding: 30px 50px;
            border-radius: 20px;
            border: 2px solid #FFB366;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .message p {
            margin: 12px 0;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Thank you for coming here.</h1>

    <div class="message">
        <p>I'm Tropos.</p>
        <p>I made my first public website.</p>
    </div>

</body>
</html>
