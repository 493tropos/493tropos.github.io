<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>素因数分解・時計</title>
		<style>
			#clock{font-size:80px;}
		</style>
	</head>

	<body>
		<div id="clock"></div>
		<script>
			function showClock() {
			// 1. 現在時刻を取得
        let now = new Date();
        let h = now.getHours();
        let m = now.getMinutes();
        let s = now.getSeconds();
    
    // 2. 表示の整形 (1桁の数字の前に0をつける)
        h = h*60;
    	m = (h+m)*60;
    	s = s+m;
    	s = s%1000
    
    
	let x=0;
	for(let kk=2; kk<s; kk++){
		if(s%kk==0){x++;}
		}
	if(x==0){x=",sso"}else{x=",ggo"}

	function amari(a){
		for(let k=2; k<=a; k++){
				if(a%k===0){return k; }
			}
		}
		

	function soin(aa2){
		if(aa2<=1){return aa2;}else{
			let aaa=[aa2];
			let a4=""
			for(let i=0; aaa[i]!==1; i++){
				a4=a4+amari(aaa[i]);
				let i2=i+1;
				aaa[i2]=aaa[i]/amari(aaa[i]);
				if(aaa[i2]!==1){
					a4=a4+"*";
				}else{
					return a4;
				}
			}
			}
		}
		
		x=soin(s);

    // 3. HTMLに表示    
	    document.getElementById("clock").innerHTML =s+" = "+x;
    }
    
    // 4. 1秒ごとにshowClock関数を呼び出す
    setInterval(showClock, 1000);

	// 初回kousinnji表示用
		showClock();
		
		</script>

		<a href="index.html" style="font-size: 36px;">トップページに戻る</a>
		<a href="memory-game.html" style="font-size: 48px;">神経衰弱はこちら</a>
    
	</body>
</html>
